name: Linux release
# Gera o binário Linux (receptor X11) e publica numa Release deste repositório.
# Roda ao publicar uma tag v*-linux* (git tag v0.3.7-linux1 && git push meu v0.3.7-linux1)
# ou manualmente em Actions > Linux release > Run workflow.
on:
  push:
    tags: ['v*-linux*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da Release a criar (por exemplo v0.3.7-linux1)'
        required: false
        type: string
permissions:
  contents: write
env:
  CARGO_INCREMENTAL: '0'
  # Sem símbolos de debug: binário de dezenas de MB em vez de centenas.
  CARGO_PROFILE_RELEASE_STRIP: symbols
jobs:
  linux:
    if: github.repository != 'oinkvm/oink'
    # glibc 2.35: roda em Debian 12 (2.36), Ubuntu 22.04+ e mais novos.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake \
            libssl-dev libasound2-dev libopus-dev libx11-dev libxtst-dev libxrandr-dev
      - name: Compilar
        run: cargo build --release --locked -p oink-agent
      - name: Empacotar
        run: |
          mkdir out
          cp target/release/oink-agent out/
          tar -C out -czf oink-agent-linux-x86_64.tar.gz oink-agent
          sha256sum oink-agent-linux-x86_64.tar.gz > oink-agent-linux-x86_64.tar.gz.sha256
          ls -lh oink-agent-linux-x86_64.tar.gz
      - name: Baixar instaladores oficiais (Windows e macOS)
        # Este fork não altera o código de Windows/macOS: reaproveita os binários oficiais
        # (mesmo protocolo) conferindo o SHA-256 publicado pelo projeto original.
        env:
          UP: https://github.com/oinkvm/oink/releases/download/v0.3.7
        run: |
          mkdir up && cd up
          for f in Oink-0.3.7-windows-x64.msi Oink-0.3.7-macos-arm64.dmg Oink-0.3.7-macos-x64.dmg; do
            curl -fsSL -O "$UP/$f"
          done
          curl -fsSL -O "$UP/SHA256SUMS"
          grep -E 'windows-x64\.msi|macos-(arm64|x64)\.dmg' SHA256SUMS | sha256sum -c -
          cd .. && mv up/*.msi up/*.dmg .
          sha256sum *.msi *.dmg oink-agent-linux-x86_64.tar.gz > SHA256SUMS
      - name: Publicar a Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Linux: oink-agent-linux-x86_64.tar.gz (receptor do fork). Windows e macOS: instaladores oficiais do Oink 0.3.7, sem alteração. Veja o README." \
            oink-agent-linux-x86_64.tar.gz oink-agent-linux-x86_64.tar.gz.sha256             Oink-0.3.7-windows-x64.msi Oink-0.3.7-macos-arm64.dmg Oink-0.3.7-macos-x64.dmg SHA256SUMS
